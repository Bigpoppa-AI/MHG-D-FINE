task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 3 # your dataset classes
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    # img_folder: /datasets/MoGuiMianJu/visdrone/VisDrone2019-DET-train/images
    # ann_file: /datasets/MoGuiMianJu/visdrone/VisDrone2019-DET-train/annotations/train.json
    img_folder: D:\DEIM_1285110460\UAVDT\UAVDT_train\train_image
    ann_file: D:\DEIM_1285110460\UAVDT\annotations_train_fixed.json
    # img_folder: /home/dataset/dataset_visdrone/VisDrone2019-DET-train/images
    # ann_file: /home/dataset/dataset_visdrone/VisDrone2019-DET-train/annotations/train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  pin_memory: True
  collate_fn:
    type: BatchImageCollateFunction


val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    # img_folder: /datasets/MoGuiMianJu/visdrone/VisDrone2019-DET-val/images
    # ann_file: /datasets/MoGuiMianJu/visdrone/VisDrone2019-DET-val/annotations/val.json
    img_folder: D:\DEIM_1285110460\UAVDT\UAVDT_val\val_image
    ann_file: D:\DEIM_1285110460\UAVDT\annotations_val_fixed.json
    # img_folder: /home/dataset/dataset_visdrone/VisDrone2019-DET-val/images
    # ann_file: /home/dataset/dataset_visdrone/VisDrone2019-DET-val/annotations/val.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  pin_memory: True
  collate_fn:
    type: BatchImageCollateFunction
