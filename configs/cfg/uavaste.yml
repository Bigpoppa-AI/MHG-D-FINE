task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 1 # your dataset classes
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: D:\DEIM_1285110460\uavaste_split\images\train
    ann_file: D:\DEIM_1285110460\uavaste_split\annotation\train.json
    return_masks: False
